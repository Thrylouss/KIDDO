# Doimiy lokal development stek — QA/test stekidan (kiddo-test) to'liq alohida.
# Faqat: docker compose -f docker-compose.dev.yml -p kiddo-dev ...
#
#   API:      http://127.0.0.1:8001/api   (baza: kiddo_dev, nomli volume — qayta ishga tushganda saqlanadi)
#   Frontend: http://127.0.0.1:3001
#
# Hostname ataylab 127.0.0.1: QA stek «localhost» da. Brauzer cookie'larni port bo'yicha ajratmaydi,
# hostname bo'yicha ajratadi — shunda dev va QA'ning kiddo_token cookie'lari bir-birini almashtirmaydi.
# Maxfiy qiymatlar (DB paroli, APP_KEY) — .env.dev (git'ga kirmaydi; namuna: .env.dev.example).
# DEV TEST MODE: konteyner ishga tushganda kiddo:dev-accounts test akkauntlarini tayyorlaydi (idempotent).
name: kiddo-dev
services:
  postgres-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.dev                     # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    volumes:
      - kiddo_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 15
    # port ochilmagan: bazaga faqat php-dev ulanadi

  php-dev:
    # docker/php/Dockerfile'dan qurilgan image. Build: docker compose ... build php-dev
    image: kiddo-dev-php:local
    build:
      context: ./docker/php
    restart: unless-stopped
    user: root                             # nomli volume'larga yozish uchun
    working_dir: /var/www/html
    env_file: .env.dev                     # DB_*, APP_KEY
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8001
      FRONTEND_URL: http://127.0.0.1:3001
      DB_CONNECTION: pgsql
      DB_HOST: postgres-dev
      DB_PORT: "5432"
      SENTRY_LARAVEL_DSN: ""
    volumes:
      - ./backend:/var/www/html
      - kiddo_dev_vendor:/var/www/html/vendor
      - kiddo_dev_storage:/var/www/html/storage   # bola rasmlari va h.k. — doimiy
    tmpfs:
      - /var/www/html/bootstrap/cache
    command:
      - sh
      - -c
      - >-
        mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs storage/app/private
        && ([ -f vendor/autoload.php ] || composer install --no-interaction --no-progress)
        && (php artisan kiddo:dev-accounts || echo "DEV TEST MODE akkauntlari tayyorlanmadi (yuqoridagi sababga qarang)")
        && exec php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres-dev:
        condition: service_healthy

  frontend-dev:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8001/api
      NEXT_ALLOWED_DEV_ORIGINS: 127.0.0.1         # Next dev resurslari (HMR, chunk'lar) 127.0.0.1 dan
    volumes:
      - ./frontend:/app
      - kiddo_dev_node_modules:/app/node_modules   # host node_modules (macOS) dan alohida
      - kiddo_dev_next:/app/.next                  # QA dev server'ning .next papkasiga tegmaydi
    command: sh -c "([ -x node_modules/.bin/next ] || npm ci --no-audit --no-fund) && exec npx next dev -H 0.0.0.0 -p 3000"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - php-dev

volumes:
  kiddo_dev_pgdata:
  kiddo_dev_vendor:
  kiddo_dev_storage:
  kiddo_dev_node_modules:
  kiddo_dev_next:

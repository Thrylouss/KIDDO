; KIDDO — production PHP sozlamalari (faqat docker-compose.prod.yml orqali ulanadi; dev stekka ta'sir qilmaydi)

; Yuklash chegaralari: guruh rasmi 5 MB, bola rasmi 2 MB, Excel import 5 MB.
; PHP standarti (upload_max_filesize=2M) 2 MB dan katta rasmlarni rad etardi.
; nginx client_max_body_size (8m) bilan mos.
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 5

memory_limit = 256M
; Davomat hisobotini PDF/Excel eksport qilish (nginx fastcgi_read_timeout 120s bilan mos)
max_execution_time = 120
max_input_time = 60

; PHP versiyasi javob sarlavhalarida ko'rinmasin; xatolar foydalanuvchiga emas, logga
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; Sessiya cookie'lari (Laravel API token cookie'sini o'zi boshqaradi — bu faqat zaxira himoya)
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

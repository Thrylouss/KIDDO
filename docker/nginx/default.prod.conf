# ═══════════════════════════════════════════════════════════════════════════
# KIDDO — production Nginx (reverse proxy + HTTPS)
#
# Ikki domen (frontend va API alohida):
#   kiddo.uz       → Next.js   (frontend:3000)
#   www.kiddo.uz   → 301 → https://kiddo.uz
#   api.kiddo.uz   → Laravel   (php:9000, PHP-FPM / FastCGI)
#
# Bitta Let's Encrypt sertifikati uchala nom uchun: /etc/letsencrypt/live/kiddo.uz/ (repoga kiritilmaydi,
# hostdan faqat o'qish uchun ulanadi). Batafsil: DEPLOYMENT.md
# ═══════════════════════════════════════════════════════════════════════════

server_tokens off;

# Next.js ilovasi (Docker ichki tarmog'i; port tashqariga ochilmaydi)
upstream kiddo_frontend {
    server frontend:3000;
    keepalive 16;
}

# WebSocket bo'lmasa ham Next.js uchun to'g'ri Connection sarlavhasi
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Umumiy TLS sozlamalari (barcha 443 serverlari uchun)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Umumiy cheklovlar
client_body_timeout   30s;
client_header_timeout 30s;
send_timeout          60s;
# keepalive_timeout — asosiy nginx.conf da (65s)

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

# ─── HTTP (80): faqat Let's Encrypt va HTTPS'ga yo'naltirish ─────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Noma'lum Host bilan HTTPS so'rovlari — ulanish yopiladi ─────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/kiddo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiddo.uz/privkey.pem;

    return 444;
}

# ─── www → asosiy domen ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kiddo.uz;

    ssl_certificate     /etc/letsencrypt/live/kiddo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiddo.uz/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    return 301 https://kiddo.uz$request_uri;
}

# ─── Frontend: kiddo.uz → Next.js ──────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiddo.uz;

    ssl_certificate     /etc/letsencrypt/live/kiddo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiddo.uz/privkey.pem;

    # Frontend fayl qabul qilmaydi (yuklashlar to'g'ridan-to'g'ri API'ga)
    client_max_body_size 1m;

    # Next.js xavfsizlik sarlavhalarini o'zi qo'yadi (next.config.ts); HSTS takrorlanmasin — faqat nginx qo'yadi
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Next.js build assetlari — nomida hash bor, o'zgarmaydi: 1 yil kesh
    location /_next/static/ {
        proxy_pass http://kiddo_frontend;
        # proxy_hide_header ichkarida e'lon qilinsa, server darajasidagisi meros bo'lmaydi — HSTS ham shu yerda
        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        access_log off;
    }

    # public/ dagi rasmlar (landing skrinshotlari, favicon) — nomida hash yo'q: 7 kun
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        proxy_pass http://kiddo_frontend;
        # proxy_hide_header ichkarida e'lon qilinsa, server darajasidagisi meros bo'lmaydi — HSTS ham shu yerda
        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        access_log off;
    }

    # Sahifalar — Next.js o'z Cache-Control sarlavhasini qo'yadi
    location / {
        proxy_pass http://kiddo_frontend;
    }
}

# ─── API: api.kiddo.uz → Laravel (PHP-FPM) ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.kiddo.uz;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/kiddo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiddo.uz/privkey.pem;

    # Eng katta yuklash: guruh rasmi 5 MB, Excel import 5 MB (+ multipart qo'shimchasi).
    # docker/php/production.ini dagi post_max_size bilan mos.
    client_max_body_size 8m;

    # Boshqa xavfsizlik sarlavhalari — Laravel SecureHeadersMiddleware (X-Frame-Options, nosniff, Referrer-Policy, ...)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location = /index.php {
        fastcgi_pass   php:9000;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_param  HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_connect_timeout 5s;
        # Davomat hisobotini PDF/Excel eksport qilish uzoqroq ishlashi mumkin
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # index.php dan boshqa .php fayllar bajarilmaydi
    location ~ \.php$ {
        return 404;
    }

    # Yashirin fayllar (.env, .git, ...) — hech qachon berilmaydi
    location ~ /\.(?!well-known) {
        deny all;
    }
}

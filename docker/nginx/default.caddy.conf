# ═══════════════════════════════════════════════════════════════════════════
# KIDDO — Caddy ortidagi Nginx (serverda boshqa loyihalar bilan birga)
#
# HTTPS va sertifikatlarni hostdagi Caddy boshqaradi; bu nginx faqat 127.0.0.1:8088 da HTTP tinglaydi.
#   Caddy: kiddo-sad.uz, api.kiddo-sad.uz → 127.0.0.1:8088 (Host sarlavhasi o'zgarmaydi)
#   www.kiddo-sad.uz → 301 → kiddo-sad.uz (Caddy'da)
# Ishga tushirish: docker compose -f docker-compose.prod.yml -f docker-compose.caddy.yml up -d
# ═══════════════════════════════════════════════════════════════════════════

server_tokens off;

# Haqiqiy mijoz IP — Caddy (host) Docker shlyuzi orqali keladi
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

upstream kiddo_frontend {
    server frontend:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

client_body_timeout   30s;
client_header_timeout 30s;
send_timeout          60s;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

# Noma'lum Host — ulanish yopiladi
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# ─── Frontend: kiddo-sad.uz → Next.js ──────────────────────────────────────
server {
    listen 80;
    server_name kiddo-sad.uz;


    # Frontend fayl qabul qilmaydi (yuklashlar to'g'ridan-to'g'ri API'ga)
    client_max_body_size 1m;

    # Next.js xavfsizlik sarlavhalarini o'zi qo'yadi (next.config.ts); HSTS takrorlanmasin — faqat nginx qo'yadi
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Next.js build assetlari — nomida hash bor, o'zgarmaydi: 1 yil kesh
    location /_next/static/ {
        proxy_pass http://kiddo_frontend;
        # proxy_hide_header ichkarida e'lon qilinsa, server darajasidagisi meros bo'lmaydi — HSTS ham shu yerda
        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        access_log off;
    }

    # public/ dagi rasmlar (landing skrinshotlari, favicon) — nomida hash yo'q: 7 kun
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        proxy_pass http://kiddo_frontend;
        # proxy_hide_header ichkarida e'lon qilinsa, server darajasidagisi meros bo'lmaydi — HSTS ham shu yerda
        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        access_log off;
    }

    # Sahifalar — Next.js o'z Cache-Control sarlavhasini qo'yadi
    location / {
        proxy_pass http://kiddo_frontend;
    }
}

# ─── API: api.kiddo-sad.uz → Laravel (PHP-FPM) ─────────────────────────────
server {
    listen 80;
    server_name api.kiddo-sad.uz;
    root /var/www/html/public;
    index index.php;
    charset utf-8;


    # Eng katta yuklash: guruh rasmi 5 MB, Excel import 5 MB (+ multipart qo'shimchasi).
    # docker/php/production.ini dagi post_max_size bilan mos.
    client_max_body_size 8m;

    # Boshqa xavfsizlik sarlavhalari — Laravel SecureHeadersMiddleware (X-Frame-Options, nosniff, Referrer-Policy, ...)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location = /index.php {
        fastcgi_pass   php:9000;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_param  HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_connect_timeout 5s;
        # Davomat hisobotini PDF/Excel eksport qilish uzoqroq ishlashi mumkin
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # index.php dan boshqa .php fayllar bajarilmaydi
    location ~ \.php$ {
        return 404;
    }

    # Yashirin fayllar (.env, .git, ...) — hech qachon berilmaydi
    location ~ /\.(?!well-known) {
        deny all;
    }
}
